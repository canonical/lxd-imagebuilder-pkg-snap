name: lxd-imagebuilder
base: bare
build-base: devel
version: git
grade: devel
summary: System container and VM image builder for LXD
description: |-
  LXD image builder is a tool which lets you create system container and VM images for use with LXD.
license: AGPL-3.0
confinement: classic

apps:
  lxd-imagebuilder:
    command: bin/lxd-imagebuilder

  simplestream-maintainer:
    command: bin/simplestream-maintainer

parts:
  lxd-imagebuilder:
    source: https://github.com/canonical/lxd-imagebuilder
    source-depth: 1
    source-type: git
    build-snaps:
      - go
    build-packages:
      - libc6-dev
    plugin: go
    build-environment:
      # Statically link libc so the binary is portable across glibc versions.
      # CGO is required (main.go uses import "C" for a pre-runtime namespace
      # unshare), so `CGO_ENABLED=0`` is not an option; statically linking is
      # used instead to avoid a runtime dependency on the host's libc.so.6.
      - GOFLAGS: "-ldflags=-extldflags=-static"

  strip:
    after:
      - lxd-imagebuilder
    plugin: nil
    override-prime: |
      set -x

      # Strip binaries
      find "${CRAFT_PRIME}"/bin -type f \
        -exec strip -s {} +
